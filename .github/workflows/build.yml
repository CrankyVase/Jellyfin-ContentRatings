name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ContentRatings.csproj

      - name: Build
        run: dotnet build ContentRatings.csproj -c Release --no-restore

      - name: Create plugin package
        run: |
          mkdir -p artifact
          cp bin/Release/net8.0/Jellyfin.Plugin.ContentRatings.dll artifact/
          cp plugin.json artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.ContentRatings
          path: artifact/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Jellyfin.Plugin.ContentRatings
          path: artifact/

      - name: Package zip for plugin repository
        id: package
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ASSEMBLY_VERSION="${VERSION}.0"
          ZIP_NAME="contentratings_${ASSEMBLY_VERSION}.zip"
          mkdir -p zip
          cp artifact/Jellyfin.Plugin.ContentRatings.dll zip/
          (cd zip && zip -j "../artifact/${ZIP_NAME}" Jellyfin.Plugin.ContentRatings.dll)
          CHECKSUM=$(md5sum "artifact/${ZIP_NAME}" | cut -d' ' -f1)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TARGET_ABI=$(jq -r '.TargetAbi' plugin.json)
          {
            echo "version=$ASSEMBLY_VERSION"
            echo "zip_name=$ZIP_NAME"
            echo "checksum=$CHECKSUM"
            echo "timestamp=$TIMESTAMP"
            echo "target_abi=$TARGET_ABI"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update plugin repository manifest
        env:
          VERSION: ${{ steps.package.outputs.version }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          TIMESTAMP: ${{ steps.package.outputs.timestamp }}
          TARGET_ABI: ${{ steps.package.outputs.target_abi }}
        run: |
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF#refs/tags/}/${ZIP_NAME}"
          CHANGELOG=$(git tag -l --format='%(contents)' "${GITHUB_REF#refs/tags/}")
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See the GitHub release notes."
          fi

          jq --arg version "$VERSION" \
             --arg changelog "$CHANGELOG" \
             --arg abi "$TARGET_ABI" \
             --arg url "$SOURCE_URL" \
             --arg checksum "$CHECKSUM" \
             --arg timestamp "$TIMESTAMP" \
             '(.[0].versions) |= ([{version: $version, changelog: $changelog, targetAbi: $abi, sourceUrl: $url, checksum: $checksum, timestamp: $timestamp}] + map(select(.version != $version)))' \
             manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update manifest.json for v${VERSION%.0}"
          git push origin HEAD:master