name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ContentRatings.csproj

      - name: Build
        run: dotnet build ContentRatings.csproj -c Release --no-restore

      - name: Create plugin package
        run: |
          mkdir -p artifact
          cp bin/Release/net8.0/Jellyfin.Plugin.ContentRatings.dll artifact/
          cp plugin.json artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.ContentRatings
          path: artifact/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Jellyfin.Plugin.ContentRatings
          path: artifact/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}